name: Build & push Bun-based Logto image

# 构建并推送基于 Bun 运行的 Logto 镜像到 ghcr.io（可选同时推 Docker Hub）。
# 由 track-upstream.yml 自动调用，也可手动触发。

on:
  workflow_call:
    inputs:
      logto_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      logto_version:
        description: 'Logto 上游版本 tag（如 v1.43.0）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 如需同时推 Docker Hub，取消注释并配置 secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，
      # 并在 metadata 的 images 列表加上 docker.io/<username>/logto-bun
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version metadata
        id: meta
        run: |
          VERSION="${{ inputs.logto_version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=${{ steps.meta.outputs.semver }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            logto_version=${{ inputs.logto_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        run: |
          docker run --rm --platform linux/amd64 --entrypoint bun \
            ${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }} --version

      # 生产级启动冒烟：真实 Postgres + 自动迁移 + 启动 core + 探活 + 重启幂等 + npm 垫片
      - name: Boot smoke test (amd64)
        run: |
          set -e
          IMAGE="${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}"
          DB="postgres://postgres:postgres@pg:5432/logto"
          cleanup() {
            docker rm -f logto logto-panel pg >/dev/null 2>&1 || true
            docker network rm logto-test >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          wait_healthy() { # $1 = container name
            for i in $(seq 1 45); do
              if docker run --rm --network logto-test curlimages/curl:latest \
                -sf -o /dev/null "http://$1:3001/api/status"; then return 0; fi
              sleep 2
            done
            return 1
          }

          docker network create logto-test
          docker run -d --name pg --network logto-test \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=logto postgres:16-alpine
          sleep 5

          echo "=== 1) 全新库：仅靠环境变量，镜像自动 seed + alteration deploy 并启动 ==="
          docker run -d --name logto --platform linux/amd64 --network logto-test \
            -e DB_URL="$DB" -e NODE_ENV=production -e PORT=3001 \
            -e TRUST_PROXY_HEADER=1 \
            -e S3_BUCKET=smoke-bucket -e S3_ACCESS_KEY_ID=smoke-key \
            -e S3_SECRET_ACCESS_KEY=smoke-secret -e S3_ENDPOINT=http://minio:9000 \
            -e S3_FORCE_PATH_STYLE=true \
            "$IMAGE"
          wait_healthy logto || { docker logs logto; echo "FAIL: not healthy"; exit 1; }
          LOGS=$(docker logs logto 2>&1)
          echo "$LOGS"
          echo "$LOGS" | grep -q "Core app is running"
          echo "$LOGS" | grep -q "deploying database alterations"   # 自动迁移已执行
          echo "$LOGS" | grep -q "upserted storageProvider"          # S3 环境变量已写入
          # S3 配置须写在 default + admin 两个 tenant（证明迁移先于 S3 同步）
          docker exec pg psql -U postgres -d logto -tAc \
            "select count(*) from logto_configs where key='storageProvider'" | grep -q '^2$'

          echo "=== 2) 重启幂等：seed 跳过、alteration 0、仍可服务 ==="
          docker restart logto >/dev/null
          wait_healthy logto || { docker logs logto; echo "FAIL: restart not healthy"; exit 1; }
          docker logs logto 2>&1 | grep -q "Seeding skipped"

          echo "=== 3) 1Panel 风格 entrypoint 覆盖（npm 垫片） ==="
          docker rm -f logto >/dev/null
          docker run -d --name logto-panel --platform linux/amd64 --network logto-test \
            -e DB_URL="$DB" -e NODE_ENV=production -e PORT=3001 \
            --entrypoint sh "$IMAGE" \
            -c "npm run cli db seed -- --swe && npm run alteration deploy latest && npm start"
          wait_healthy logto-panel || { docker logs logto-panel; echo "FAIL: npm shim path"; exit 1; }
          docker logs logto-panel 2>&1 | grep -q "Core app is running"
          echo "boot smoke test passed"
