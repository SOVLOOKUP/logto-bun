name: Build & push Bun-based Logto image

# 构建并推送基于 Bun 运行的 Logto 镜像到 ghcr.io（可选同时推 Docker Hub）。
# 由 track-upstream.yml 自动调用，也可手动触发。

on:
  workflow_call:
    inputs:
      logto_version:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      logto_version:
        description: 'Logto 上游版本 tag（如 v1.43.0）'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 如需同时推 Docker Hub，取消注释并配置 secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN，
      # 并在 metadata 的 images 列表加上 docker.io/<username>/logto-bun
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract version metadata
        id: meta
        run: |
          VERSION="${{ inputs.logto_version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "semver=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.image }}
          tags: |
            type=raw,value=${{ steps.meta.outputs.version }}
            type=raw,value=${{ steps.meta.outputs.semver }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            logto_version=${{ inputs.logto_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        run: |
          docker run --rm --platform linux/amd64 --entrypoint bun \
            ${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }} --version

      # 生产级启动冒烟：真实 Postgres + seed + 启动 core + 探活
      - name: Boot smoke test (amd64)
        run: |
          docker network create logto-test
          docker run -d --name pg --network logto-test \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=logto postgres:16-alpine
          sleep 5
          IMAGE="${{ steps.image.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker run --rm --platform linux/amd64 --network logto-test \
            -e DB_URL=postgresql://postgres:postgres@pg:5432/logto \
            "$IMAGE" cli db seed --swe
          docker run -d --name logto --platform linux/amd64 --network logto-test \
            -e DB_URL=postgresql://postgres:postgres@pg:5432/logto \
            -e NODE_ENV=production -e PORT=3001 \
            "$IMAGE"
          OK=""
          for i in $(seq 1 30); do
            if docker run --rm --network logto-test curlimages/curl:latest \
              -sf -o /dev/null http://logto:3001/api/status; then OK=1; break; fi
            sleep 2
          done
          docker logs logto 2>&1
          [ -n "$OK" ] || { docker rm -f logto pg >/dev/null 2>&1; docker network rm logto-test >/dev/null 2>&1; exit 1; }
          docker logs logto 2>&1 | grep -q "Core app is running"
          docker rm -f logto pg >/dev/null 2>&1; docker network rm logto-test >/dev/null 2>&1
          echo "boot smoke test passed"
